name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_REGION: us-east4
  REPO_NAME: it-jobs-worldwide-artifacts
  NOTIFIER_REGION: europe-west1
  SCRAPER_REGION: europe-north1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservices
        run: |
          REGISTRY="${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}"
          TAG=$(git rev-parse --short HEAD)

          # bot service (ARM)
          docker buildx build --platform linux/arm64 \
            -t $REGISTRY/bot:$TAG \
            -t $REGISTRY/bot:latest \
            --push -f ./services/bot/Dockerfile .

          # updater service (ARM)
          docker buildx build --platform linux/arm64 \
            -t $REGISTRY/db_updater:$TAG \
            -t $REGISTRY/db_updater:latest \
            --push -f ./services/db_updater/Dockerfile .

          # scraper service
          docker build -t $REGISTRY/scraper:$TAG -t $REGISTRY/scraper:latest -f ./services/scraper/Dockerfile .
          docker push $REGISTRY/scraper:$TAG
          docker push $REGISTRY/scraper:latest

          # notifier service
          docker build -t $REGISTRY/notifier:$TAG -t $REGISTRY/notifier:latest -f ./services/notifier/Dockerfile .
          docker push $REGISTRY/notifier:$TAG
          docker push $REGISTRY/notifier:latest

      - name: Deploy to Cloud Run
        run: |
          REGISTRY="${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}"
          TAG=$(git rev-parse --short HEAD)
          
          gcloud run deploy scraper \
            --image $REGISTRY/scraper:$TAG \
            --region ${{ env.SCRAPER_REGION }} \
            --quiet

          gcloud run deploy notifier \
            --image $REGISTRY/notifier:$TAG \
            --region ${{ env.NOTIFIER_REGION }} \
            --quiet
